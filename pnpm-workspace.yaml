minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.138'
  - '@ai-sdk/google@4.0.114'
  - '@ai-sdk/openai-compatible@3.0.87'
  - '@ai-sdk/openai@4.0.111'
  - '@ai-sdk/provider-utils@5.0.76'
  - '@ai-sdk/provider@4.0.37'
  - ai@7.0.165

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3 # See https://github.com/paulmillr/chokidar/issues/1440
  - semver@6.3.1 # See https://github.com/npm/node-semver/issues/838

autoInstallPeers: false
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
strictDepBuilds: false

overrides:
  nanoid: 3.3.8

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  pnpm: true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: false
